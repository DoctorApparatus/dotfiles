# // ABSOLUTE_SOLVER // TMUX CONFIG

# --- SHELL SETTINGS ---
set-option -g default-shell /bin/zsh

# --- CORE SETTINGS ---
set -g @shell_mode 'vi'
set -g base-index 1
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g status-position bottom
set -g status-interval 60

# --- TERMINAL & COLORS ---
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- PLUGIN MANAGER ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin "loichyan/tmux-toggle-popup"
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'pschmitt/tmux-ssh-split'

# --- THEME: ABSOLUTE SOLVER ---
# No rounded corners. No gradients. High contrast.

# 1. Status Bar Base
set -g status-justify left
set -g status-style bg="#000000",fg="#FFFFFF"
set -g status-left-length 200
set -g status-right-length 200

# 2. Window Status (Inactive) -> Muted Grey
set -g window-status-format "#[fg=#404040] #I:[#W] "
# 3. Window Status (Active) -> Solver Yellow & Bold
set -g window-status-current-format "#[fg=#FFD700,bold] #I:[#W] "
# 4. Separator -> Sharp Pipe
set -g window-status-separator "#[fg=#262626]|"

# 5. Left Module (Session Name)
# Black text on Yellow block for high visibility
set -g status-left "#[bg=#FFD700,fg=#000000,bold] #S #[bg=#000000,fg=default] "

# 6. Right Module (Date/Time)
# Muted Grey date, Yellow time. No icons if possible, or keep them minimal.
set -g status-right "#[fg=#A3A3A3] %Y-%m-%d #[fg=#262626]│ #[fg=#FFD700,bold]%H:%M "

# 7. Pane Borders
# Inactive panes fade into the void. Active pane glows yellow.
set -g pane-border-style fg="#262626"
set -g pane-active-border-style fg="#FFD700"

# 8. Command/Message Line
set -g message-style bg="#FFD700",fg="#000000",bold

# 9. Selection Mode (Copy Mode)
set -g mode-style bg="#FFD700",fg="#000000",bold

# --- PLUGIN CONFIGURATION ---

# Continuum
set -g @continuum-save-interval '60'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'kitty'

# SSH Split
set-option -g @ssh-split-keep-cwd "true"
set-option -g @ssh-split-keep-remote-cwd "true"
set-option -g @ssh-split-fail "false"
set-option -g @ssh-split-no-env "false"
set-option -g @ssh-split-no-shell "false"
set-option -g @ssh-split-strip-cmd "true"
set-option -g @ssh-split-verbose "true"
set-option -g @ssh-split-debug "false"
set-option -g @ssh-split-h-key "|"
set-option -g @ssh-split-v-key "-"
set-option -g @ssh-split-w-key "C"

# Tmux.nvim Navigation
set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

# --- KEYBINDINGS ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source ~/.config/tmux/tmux.conf \; display " [ CONFIG RELOADED ] "
bind q killp
bind-key x kill-pane # skip prompt
set -g detach-on-destroy off

# Sesh Popup (Using Sharp Borders if tool supports it)
bind-key "s" display-popup -E -w 40% "sesh connect \"$(
    sesh list -i | gum filter --limit 1 --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
)\""

# SSH Session Popup
bind-key "R" display-popup -E -w 40% "$HOME/.config/tmux/ssh_session.sh \"$(
    cat $HOME/.ssh/config | grep -e 'Host [a-zA-Z0-9\.]' | sed -e 's/Host //g' | gum filter 
)\""

# Scratchpad Toggle
bind C-a run "#{@popup-toggle} --force --name scratch -Ed'#{pane_current_path}' -w98% -h98%"

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Unbind for atuin history
unbind-key -T copy-mode C-r

#run '~/.local/share/tmux/plugins/tpm/tpm'
